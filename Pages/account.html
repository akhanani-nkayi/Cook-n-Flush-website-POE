<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Assets/CSS/styles.css">
    <title>Cook n Flush</title>
</head>
<body>
    <header>
        <!-- Logo --> 
         <div> 
            <img src="../Assets/Images/Logo image.jpg" 
            alt="Cook n Flush Logo" 
            width="100" 
            height="100">  
        </div>

        <!-- Navigation Menu -->
        <nav>
            <a class="nav-link" href="../index.html">HOME</a>
            <a class="nav-link" href="./about.html">ABOUT US</a>
            <a class="nav-link" href="./products.html">PRODUCTS</a>
            <a class="nav-link" href="./detail.html">DETAILS</a>
            <a class="nav-link" href="./contact.html">CONTACT US</a>
            <a class="nav-link" href="./enquiry.html">ENQUIRY</a>
            <a class="nav-link" href="./account.html">ACCOUNT</a>
        </nav>
    </header>
    <!--Main section-->
    <main>
        <section>
            <h1 style="color: blue; text-align: center;">Login</h1>
            <form action="#" method="post">
                <label for="loginEmail">Email:</label>
                <input type="email" id="loginEmail" name="loginEmail" required>
                <br><br>
                <label for="loginPassword">Password:</label>
                <input type="password" id="loginPassword" name="loginPassword" required>
                <br><br>
                <input type="submit" value="Login">
            </form>
        </section>
        <hr>
        <!-- Register Section -->
        <section>
            <h1 style="color: blue; text-align: center;">Register</h1>
            <form action="#" method="post">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>
                <br><br>
                <label for="registerEmail">Email:</label>
                <input type="email" id="registerEmail" name="registerEmail" required>
                <br><br>
                <label for="registerPassword">Password:</label>
                <input type="password" id="registerPassword" name="registerPassword" required>
                <br><br>
                <label for="confirmPassword">Confirm Password:</label>
                <input type="password" id="confirmPassword" name="confirmPassword" required>
                <br><br>
                <input type="submit" value="Create Account">
            </form>
    </main>

    <footer>
        <p>
            <a href="./privacy.html">Privacy Policy</a> |
            <a href="./terms.html">Terms</a>
        </p>
        <p>&copy; 2026 Cook n Flush. All rights reserved.</p>
    
</body>
</html>
